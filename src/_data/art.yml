- title: CPH Zine Fest - Workshop
  img: /assets/img/zine-workshop.jpg
  country: 
  slug: zine-workshop
  description:
    - Do you want to make a everlasting memory with your friends from FoEG 2026? Are you curious about zines? Then come to Community Zine Workshop where we’ll make a little handmade flyer, a book - a zine - as we call it. You can cut and paste, draw or write about a fun FoEG experience. We have all the materials, but if you have something speciel you want to incorporate into the zine, we can scan it for you. The workshop is free and you can pick up the zine we’ve made together on the final day of the festival.
    - The Workshop is Friday @ 18:00-19:30.
    - "Note: The workshop is free but you need to get a ticket to reserve a spot."
