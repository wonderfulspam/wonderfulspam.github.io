- section: The Mall

- title: Forlaget Escho
  img: /assets/img/escho.jpg
  country: 
  slug: escho
  description:
  - Forlaget Escho specializes in publishing books from the fringes of literature. Works that, in a parallel world, would be considered classics, but which for one reason or another have been forgotten in our own small comfort zone.

- title: Forlaget sidste århundrede
  img: /assets/img/sidste.jpg
  country: 
  slug: sidste
  description:  
  -  The small press Sidste Århundrede continues to publish and promote overlooked writers. Since 2015, they have released a wide array of translated fiction from outside the established canon, focusing on decay, decline, decadence and hard times. That time is still now.

- title: Afvikling kassetter
  img: /assets/img/afvikling.jpg
  country: 
  slug: afvikling
  description:
  - Afvikling is a primitive cassette label run from my apartment. It releases music by dear friends of mine as well as my own recordings and other private audio documents. All releases are open editions of recycled cassettes and will stay in print until the year 2075 when I reach retirement age. The label was started to document things I find important, as well as a way to Force myself to reach out to my friends, which I’m often times not very good at. I see the label as and ever expanding archive of sound and friendship. 


- title: CPH Zine Fest - Shop
  img: /assets/img/zine-shop2.jpg
  country: 
  slug: zine-shop
  description:
  - CPH Zine Fest Distro is a collection of zines produced by a wide range of zine makers who has attended our festival through the 12 years of our exsistence. A zine is a selfmade flyer containing anything you want - poems, photos, drawings, art or comics. CPH Zine fest is a 4 day festival in october and a 1 day zine fair in Odense. We celebrate zines, small press, art books and all things DIY + DIT. On our festival in CPH we have talks, concerts, workshops and two zine fairs. We are so excited to come to Festival of Endless Gratitude 2026 to show you what zines is. 


- section: Food & Drinks

- title: Community Dinner by Manna Café
  img: /assets/img/manna.jpg
  country: 
  slug: community-dinner
  description:
  - Join us for a delicious meal with good company at the FOEG community dinner!
  - This year the menu for the community dinner is provided by Manna Café & Bar.
  - Manna Café and Bar is a local, family-run spot built around a love of good food and good company, with great care for each other and the people around them. Everything is made from scratch using the best seasonal ingredients, and every day they bake their own sourdough bread, which is at the heart of many of their dishes—from brunch and open sandwiches to small plates served with cold drinks from the bar.
  - Community is a big part of what Manna does. Their weekly communal dinners bring neighbours, friends and strangers together around long tables to share food and spend time together at their cosy spot in Amager, Copenhagen.
  - "The menu: Homemade sourdough bread, oven-roasted cauliflower with herb dressing, potatoes with chilli aioli and beetroot salad with pears, walnuts and mustard dressing."
  - The community dinner will be held Saturday evening September 26. Tickets are 130 DKK + fee (presale), and we recommend you secure your ticket online, in case they sell out. 
  - "Note: the ticket is available when you click next - at the add-ons."
  - <a href="https://www.instagram.com/manna_cafe/">@manna_cafe</a>
